<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Amaravati Travels – About Us</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="header">
    <h1>Amaravati Travels</h1>
    <nav>
      <ul>
        <li><a href="about.html">About Us</a></li>
        <li><a href="admin.html">Admin Portal</a></li>
      </ul>
    </nav>
    <div class="top-info">
      <p><strong>Proprietor:</strong> V. Venkata Raju</p>
      <p><strong>Mobile:</strong> 9393453999</p>
      <p><strong>Email:</strong> <a href="mailto:amaravatitravels@yahoo.co.in">amaravatitravels@yahoo.co.in</a></p>
    </div>
  </header>
  <main>
    <section class="card">
      <h2>About Us</h2>
      <p>About Amaravati Travels. We provide reliable bus services for companies and offices.</p>
    </section>

    <section class="card">
      <h2>Book a Ride</h2>
      <form action="#" method="POST" class="booking-form">
        <div class="form-group">
          <label for="vehicle-type">Vehicle Type</label>
          <select id="vehicle-type" name="vehicle-type">
            <option value="car">Car</option>
            <option value="bus">Bus</option>
          </select>
        </div>
        <div class="form-group">
          <label for="start-time">Pickup Date & Time</label>
          <input type="datetime-local" id="start-time" name="start-time" required />
        </div>
        <div class="form-group">
          <label for="end-time">Return Date & Time</label>
          <input type="datetime-local" id="end-time" name="end-time" required />
        </div>
        <button type="submit">Book Now</button>
      </form>
    </section>
  </main>
  <div class="wave3"></div>
  <footer class="footer">
    <p>&copy; 2026 Amaravathi Travels. All rights reserved.</p>
  </footer>
  <script src="script.js"></script>
</body>
</html>
